<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Album Admin</title>
<style>
  :root{--glass:rgba(255,255,255,.28);--glass-edge:rgba(255,255,255,.65)}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;height:100dvh;overflow:hidden;font:12px/1.4 "Segoe UI",Tahoma,Arial,sans-serif}
  body{background:
    radial-gradient(ellipse 60% 40% at 70% 30%,rgba(255,255,255,.55),transparent 60%),
    radial-gradient(ellipse 80% 50% at 20% 80%,rgba(0,60,140,.7),transparent 70%),
    linear-gradient(160deg,#6fc3f0 0%,#1b7fd1 45%,#0a3f8f 100%);background-attachment:fixed}
  .hide{display:none!important}

  /* window chrome (same as index.html) */
  .win{position:fixed;display:flex;flex-direction:column;padding:0 7px 7px;
    background:var(--glass);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);
    border:1px solid var(--glass-edge);box-shadow:0 0 0 1px rgba(0,0,0,.55),0 12px 40px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.35);
    animation:pop .25s cubic-bezier(.2,.9,.3,1.1)}
  @keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
  /* popup sign-in */
  .win.small{left:50%;top:50%;width:min(380px,94vw);translate:-50% -50%;border-radius:8px 8px 4px 4px}
  /* maximized admin window */
  .win.full{inset:0;border-radius:0;padding-bottom:calc(7px + env(safe-area-inset-bottom,0px));padding-top:env(safe-area-inset-top,0px)}
  .titlebar{height:30px;display:flex;align-items:center;gap:8px;color:#000;text-shadow:0 0 8px #fff,0 0 4px #fff;flex:none}
  .titlebar .ttl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .titlebar svg{width:16px;height:16px}
  .ctrl{display:flex;margin-top:-8px}
  .ctrl button{width:28px;height:18px;min-width:0;margin:0;padding:0;border:1px solid rgba(0,0,0,.55);border-top:none;border-radius:0;
    background:linear-gradient(#e8eef7,#b9c7dc 50%,#a3b4cf 50%,#c5d3e8);color:#222;font-size:11px;box-shadow:none;cursor:pointer}
  .ctrl button:first-child{border-radius:0 0 0 4px}
  .ctrl button.x{width:46px;border-radius:0 0 4px 0;color:#fff;text-shadow:0 0 2px #500;background:linear-gradient(#e9a095,#cf4a38 50%,#b91e0c 50%,#e0614a)}
  .ctrl button.x:hover{background:linear-gradient(#f4b3a8,#ec5f4a 50%,#d9301a 50%,#f27a62)}
  .wbody{flex:1;display:flex;flex-direction:column;background:#fff;border:1px solid #6b7c96;min-height:0}
  .toolbar{display:flex;align-items:center;gap:8px;padding:5px 8px;background:linear-gradient(#fafcff,#e4ecf7);border-bottom:1px solid #c3cfe0;color:#1e395b;flex:none}
  .toolbar .addr{flex:1;min-width:0;background:#fff;border:1px solid #9fb0c8;padding:3px 8px;border-radius:2px;color:#000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav{width:24px;height:24px;border-radius:50%;border:1px solid #5a7aa8;background:radial-gradient(circle at 35% 30%,#fff,#8fb4e6 60%,#4f7fc0);color:#fff;font-weight:bold;line-height:20px;text-align:center;opacity:.8;flex:none}
  .content{flex:1;overflow:auto;padding:16px;-webkit-overflow-scrolling:touch}
  .inner{max-width:760px;margin:0 auto}
  .status{padding:4px 10px;color:#444;background:linear-gradient(#f6f9fd,#e6edf7);border-top:1px solid #c3cfe0;flex:none}

  /* controls */
  h2{font:400 16px "Segoe UI",sans-serif;color:#1e3a8a;margin:0 0 8px}
  label{display:block;margin:12px 0 4px}
  input,textarea{width:100%;padding:4px 6px;font:12px "Segoe UI",Tahoma,sans-serif;background:#fff;border:1px solid #abadb3;border-top-color:#7a7d83;border-radius:2px}
  input:focus,textarea:focus{outline:0;border-color:#3d7bbd;box-shadow:0 0 3px rgba(61,123,189,.7)}
  button{font:12px "Segoe UI",Tahoma,sans-serif;color:#000;min-width:75px;padding:4px 14px;margin-top:14px;cursor:pointer;border-radius:3px;
    border:1px solid #707070;background:linear-gradient(#f2f2f2,#ebebeb 49%,#ddd 50%,#cfcfcf);box-shadow:inset 0 0 0 1px rgba(255,255,255,.8)}
  button:hover{border-color:#3c7fb1;background:linear-gradient(#eaf6fd,#d9f0fc 49%,#bee6fd 50%,#a7d9f5)}
  button:active{border-color:#2c628b;background:linear-gradient(#e5f4fc,#c4e5f6 49%,#98d1ef 50%,#68b3db)}
  button:focus-visible{outline:1px dotted #000;outline-offset:-4px}
  button.def{border-color:#3c7fb1;box-shadow:inset 0 0 0 1px #8fd0f5}
  button.sm{margin:0;min-width:0;padding:2px 10px}
  .tabs{display:flex;gap:2px;padding:0 4px;position:relative;z-index:1;flex-wrap:wrap}
  .tabs button{margin:0;min-width:0;padding:4px 16px;border-radius:3px 3px 0 0;border:1px solid #898c95;border-bottom:0;background:linear-gradient(#f6f6f6,#e4e4e4);box-shadow:none}
  .tabs button.on{background:#fff;padding-bottom:6px;margin-top:-2px;font-weight:600}
  .pane{border:1px solid #898c95;padding:12px;margin-top:-1px;background:#fff}
  .drop{border:1px dashed #7a9cc4;background:#f4f9fd;padding:26px;text-align:center;cursor:pointer;color:#33527a}
  .drop:hover,.drop.over{background:#e3f1fc;border-color:#3d7bbd}
  .prev{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px;margin-top:10px}
  .prev img{width:100%;aspect-ratio:1;object-fit:cover;border:1px solid #aaa;padding:2px;background:#fff}
  .lp iframe,.lp video{display:block;width:100%;max-width:420px;aspect-ratio:16/9;border:1px solid #aaa;margin-top:10px;background:#000}
  select{width:100%;padding:4px 6px;font:12px "Segoe UI",Tahoma,sans-serif;background:#fff;border:1px solid #abadb3;border-top-color:#7a7d83;border-radius:2px}
  .frow{display:flex;gap:6px;align-items:center}
  .frow select{flex:1;min-width:0}
  button:disabled{opacity:.5;cursor:default}
  #qbox{margin-top:12px;border:1px solid #9fb0c8;background:#f4f9fd;padding:8px}
  #qsum{font-weight:600;color:#1e3a8a;margin-bottom:6px}
  #qlist{max-height:180px;overflow:auto;background:#fff}
  .qb{display:flex;gap:6px;margin-top:8px}.qb button{margin:0}
  .bad{color:#b91e0c}
  .frow button{margin:0;flex:none}
  .bar{height:16px;margin-top:14px;border:1px solid #8e8f8f;border-radius:3px;background:linear-gradient(#e6e6e6,#f5f5f5);overflow:hidden;padding:1px}
  .bar i{display:block;height:100%;width:0;border-radius:2px;transition:width .3s;background:linear-gradient(#b6f2a8,#5ed84a 45%,#1fa80f 50%,#5ed84a)}
  #msg{margin-top:8px;min-height:16px}
  .list{border:1px solid #828790;margin-top:6px}
  .row{display:flex;align-items:center;gap:10px;padding:5px 8px;border-bottom:1px solid #eef0f3}
  .row:hover{background:linear-gradient(#f8fbfe,#e5f1fb);box-shadow:inset 0 0 0 1px #b8d6fb}
  .row span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row em{font-style:normal;color:#1e3a8a;margin-right:6px}
  .row small{color:#777;margin-left:6px}
  .mini{width:56px;height:42px;flex:none;border:1px solid #aaa;background:#eef2f8;display:grid;place-items:center;overflow:hidden;cursor:pointer;font-size:20px}
  .mini img,.mini video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  .empty{padding:12px;color:#666}
  /* preview modal */
  #pov{position:fixed;inset:0;z-index:50;background:rgba(0,20,50,.55);display:none;align-items:center;justify-content:center;padding:10px}
  #pov.on{display:flex}
  #pbox{width:min(860px,100%);max-height:100%;background:#fff;border:1px solid #6b7c96;box-shadow:0 12px 40px rgba(0,0,0,.6);display:flex;flex-direction:column}
  #pbox .ph{display:flex;align-items:center;padding:4px 8px;background:linear-gradient(#fafcff,#e4ecf7);border-bottom:1px solid #c3cfe0}
  #pbox .ph span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  #pbox .ph button{margin:0}
  #pc{background:#101826;display:flex;align-items:center;justify-content:center;overflow:auto;min-height:0}
  #pc img,#pc video{max-width:100%;max-height:72vh;display:block}
  #pc iframe{width:100%;aspect-ratio:16/9;max-height:72vh;border:0}
  #pc.note{background:#fff;align-items:flex-start;justify-content:flex-start;padding:12px;white-space:pre-wrap;font:14px Consolas,monospace}
  @media (prefers-reduced-motion:reduce){.win{animation:none}}
</style>
</head>
<body>

<!-- Sign-in popup -->
<div class="win small" id="login">
  <div class="titlebar"><div class="ttl">Sign in</div>
    <div class="ctrl"><button class="x" onclick="goHome()" title="Close">&#10005;</button></div></div>
  <div class="wbody"><div class="content">
    <h2>Album Admin</h2>
    <p>Enter the admin password to continue.</p>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <div style="text-align:right"><button class="def" onclick="login()">OK</button></div>
    <div id="lm" style="margin-top:8px"></div>
  </div></div>
</div>

<!-- Full-screen admin window -->
<div class="win full hide" id="panel">
  <div class="titlebar"><div class="ttl">Album Admin</div>
    <div class="ctrl"><button class="x" onclick="logout()" title="Close and sign out">&#10005;</button></div></div>
  <div class="wbody">
    <div class="toolbar"><div class="nav">&#8592;</div><div class="nav">&#8594;</div><div class="addr">Computer &#9656; Album Admin</div></div>
    <div class="content"><div class="inner">
      <h2>Add to the album</h2>
      <div class="tabs"><button class="on" data-t="photo">Photos</button><button data-t="video">Video link</button><button data-t="youtube">YouTube</button><button data-t="note">Note</button></div>
      <div class="pane">
        <label style="margin-top:0" for="fold">Folder</label>
        <div class="frow"><select id="fold"><option value="">Unsorted (no folder)</option></select>
          <button class="sm" onclick="mkFolder()" title="Create a new folder">+ New folder</button>
          <button class="sm" id="dfb" onclick="delFolder()" title="Delete this folder and everything in it" disabled>Delete folder</button></div>

        <div id="t-photo"><label for="files">Photos (select many at once) <span style="color:#777">· original quality (files over 8 MB are saved at 95% JPEG, full resolution)</span></label>
          <div class="drop" id="drop"><span id="droptxt">Click or drop images here</span><input id="files" type="file" accept="image/*" multiple hidden></div>
          <div class="prev" id="pv"></div></div>
        <div id="t-video" class="hide"><label for="vurl">GitHub / direct video link (.mp4)</label>
          <input id="vurl" placeholder="https://github.com/user/repo/raw/main/video.mp4"></div>
        <div id="t-youtube" class="hide"><label for="yurl">YouTube link</label>
          <input id="yurl" placeholder="https://www.youtube.com/watch?v=… or https://youtu.be/…"></div>
        <div id="t-note" class="hide"><label for="ntext">Note</label>
          <textarea id="ntext" rows="5" placeholder="Write a memory…"></textarea></div>
        <div class="lp" id="lp"></div>

        <label for="cap">Caption <span style="color:#777">(photos: applied to all selected)</span></label>
        <input id="cap" placeholder="Optional caption">
        <button class="def" onclick="submitIt()">Upload</button>
        <div class="bar"><i id="bar"></i></div><div id="msg"></div>
        <div id="qbox" class="hide"><div id="qsum"></div><div class="list" id="qlist"></div>
          <div class="qb"><button class="sm def" id="qretry" onclick="runQueue()">Retry / Resume</button><button class="sm" id="qclear" onclick="clearFailed()">Remove failed</button></div></div>
      </div>
      <h2 style="margin-top:22px">Manage</h2>
      <div class="list" id="list"><div class="empty">Loading…</div></div>
    </div></div>
    <div class="status" id="status">Ready</div>
  </div>
</div>

<!-- Preview modal -->
<div id="pov"><div id="pbox"><div class="ph"><span id="pt"></span><button class="sm" onclick="closeP()">Close</button></div><div id="pc"></div></div></div>

<script>
const API='https://script.google.com/macros/s/AKfycbzL8juVyRERCFCKcedeAAKWkVJH_dJ6fm1EucC6mWiyf_ycnk9RNtWoxPQ3JwWR4ezy/exec';
let PW=sessionStorage.getItem('pw')||'',tab='photo',picked=[],ITEMS=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const post=o=>fetch(API,{method:'POST',body:JSON.stringify({password:PW,...o})}).then(r=>r.json());
const say=t=>{$('msg').textContent=t;$('status').textContent=t||'Ready'};
const HOME='index.html';
const vurl=u=>String(u).replace('/blob/','/raw/');
const ytId=u=>{const m=String(u||'').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/))([\w-]{11})/);return m?m[1]:''};
const goHome=()=>{
  let ref='';
  try{const u=new URL(document.referrer);if(u.origin===location.origin&&!u.pathname.endsWith('admin.html'))ref=u.href}catch(e){}
  location.replace(ref||HOME);
};

async function login(){
  PW=$('pw').value;$('lm').textContent='Checking…';
  try{const r=await post({action:'check'});if(r.ok){sessionStorage.setItem('pw',PW);open_()}else $('lm').textContent='Error: '+r.error}
  catch(e){$('lm').textContent='Network error. Check your connection and try again.'}
}
function open_(){$('login').classList.add('hide');$('panel').classList.remove('hide');load();initQ()}
function logout(){sessionStorage.removeItem('pw');PW='';goHome()}
if(PW)post({action:'check'}).then(r=>r.ok&&open_()).catch(()=>{});
$('pw').addEventListener('keydown',e=>e.key==='Enter'&&login());
$('pw').focus();

const TABS=['photo','video','youtube','note'];
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  tab=b.dataset.t;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  TABS.forEach(t=>$('t-'+t).classList.toggle('hide',t!==tab));lp();
});
$('drop').onclick=()=>$('files').click();
$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('over')};
$('drop').ondragleave=()=>$('drop').classList.remove('over');
$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('over');pick(e.dataTransfer.files)};
$('files').onchange=e=>pick(e.target.files);
function pick(fl){picked=[...fl].filter(f=>f.type.startsWith('image/'));
  $('pv').innerHTML='';picked.forEach(f=>{const i=new Image();i.src=URL.createObjectURL(f);$('pv').appendChild(i)});
  $('droptxt').textContent=picked.length+' image(s) selected';}
/* SAFE ORIGINAL-QUALITY UPLOAD
   - up to 8 MB: sent exactly as-is (no change at all)
   - over 8 MB: full resolution, re-saved as JPEG at 95% (print quality) so the script never fails
   - every file is retried 3 times; one failed file never stops the others */
const SAFE=8*1024*1024,MAXF=25*1024*1024;
const b64=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(new Error('Cannot read file'));r.readAsDataURL(blob)});
function toJpeg(file,q,scale){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*scale);c.height=Math.round(img.naturalHeight*scale);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
    c.toBlob(b=>b?res(b):rej(new Error('encode failed')),'image/jpeg',q)};
  img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('decode failed'))};img.src=u})}
async function prepare(file){
  if(file.size<=SAFE)return{data:await b64(file),mime:file.type||'image/jpeg',name:file.name,opt:false};
  try{for(const [q,s] of [[.95,1],[.92,1],[.88,1],[.85,.8]]){const b=await toJpeg(file,q,s);
    if(b.size<=SAFE)return{data:await b64(b),mime:'image/jpeg',name:file.name.replace(/\.\w+$/,'')+'.jpg',opt:true}}}catch(e){}
  if(file.size<=MAXF)return{data:await b64(file),mime:file.type||'image/jpeg',name:file.name,opt:false};
  throw new Error(file.name+' is too large')}
async function postRetry(o,n=3){let err;for(let t=0;t<n;t++){
  try{const r=await post(o);if(r.ok)return r;if(r.error==='Wrong password')throw new Error(r.error);err=new Error(r.error)}
  catch(e){err=e;if(e.message==='Wrong password')throw e}
  await new Promise(r=>setTimeout(r,1500*(t+1)))}throw err}
const newUid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

/* live preview of pasted video / YouTube links */
function lp(){
  const b=$('lp');
  if(tab==='youtube'){const v=$('yurl').value.trim(),id=ytId(v);
    b.innerHTML=id?`<iframe src="https://www.youtube-nocookie.com/embed/${id}" allowfullscreen></iframe>`:(v?'<div class="empty">Not a valid YouTube link</div>':'')}
  else if(tab==='video'){const u=$('vurl').value.trim();
    b.innerHTML=u?`<video controls preload="metadata" src="${esc(vurl(u))}"></video>`:''}
  else b.innerHTML='';
}
$('yurl').addEventListener('input',lp);
$('vurl').addEventListener('change',lp);
$('vurl').addEventListener('paste',()=>setTimeout(lp,0));

/* ---------- folder dropdown ---------- */
function fillFolders(keep){
  const cur=keep!==undefined?keep:$('fold').value;
  const names=[...new Set(ITEMS.map(i=>i.place).filter(Boolean))].sort((x,y)=>x.localeCompare(y));
  $('fold').innerHTML='<option value="">Unsorted (no folder)</option>'+names.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');
  $('fold').value=names.includes(cur)?cur:'';$('dfb').disabled=!$('fold').value;
}
$('fold').addEventListener('change',()=>{$('dfb').disabled=!$('fold').value});
async function mkFolder(){
  const name=(prompt('New folder name:')||'').trim();if(!name)return;
  if([...$('fold').options].some(o=>o.value===name)){$('fold').value=name;$('dfb').disabled=false;return say('Folder already exists, selected.')}
  try{const r=await post({action:'folder',place:name});if(!r.ok)throw new Error(r.error);await load();fillFolders(name);say('Folder "'+name+'" created.')}
  catch(e){say('Error: '+e.message)}
}
async function delFolder(){
  const f=$('fold').value;if(!f)return;
  const n=ITEMS.filter(i=>i.place===f&&i.type!=='folder').length;
  if(!confirm(`Delete folder "${f}" and ALL ${n} item(s) inside it?\nPhotos go to the Drive trash.`))return;
  const t=prompt('To confirm, type the folder name:');if(t===null||t.trim()!==f)return say('Cancelled: name did not match.');
  say('Deleting folder…');
  try{const r=await post({action:'deletefolder',place:f});if(!r.ok)throw new Error(r.error);await load();say(`Folder "${f}" deleted (${r.deleted} entries removed).`)}
  catch(e){say('Error: '+e.message)}
}

/* ---------- upload queue: survives failures AND page reloads (IndexedDB) ---------- */
let Q=[],DB=null,running=false,SAVED=+(localStorage.getItem('q_saved')||0),optN=0;
const setSaved=n=>{SAVED=n;try{localStorage.setItem('q_saved',n)}catch(e){}};
const idb=()=>new Promise(res=>{try{const rq=indexedDB.open('albumq',1);rq.onupgradeneeded=()=>rq.result.createObjectStore('q',{keyPath:'id'});rq.onsuccess=()=>res(rq.result);rq.onerror=()=>res(null)}catch(e){res(null)}});
const tx=(mode,fn)=>new Promise(res=>{if(!DB)return res();try{const t=DB.transaction('q',mode),rq=fn(t.objectStore('q'));t.oncomplete=()=>res(rq&&rq.result);t.onerror=t.onabort=()=>res()}catch(e){res()}});
const qPut=r=>tx('readwrite',s=>s.put(r)),qDel=id=>tx('readwrite',s=>s.delete(id)),qAll=()=>tx('readonly',s=>s.getAll());
async function initQ(){
  if(!DB)DB=await idb();
  Q=(await qAll())||[];Q.forEach(r=>{if(r.status==='uploading')r.status='pending'});
  renderQ();
  if(Q.length)say(`${Q.length} photo(s) from last time are still waiting. Press "Retry / Resume".`);
}
async function enqueue(files,place,caption){
  if(!Q.length)setSaved(0);                       /* new batch */
  for(const f of files){const r={id:newUid(),uid:newUid(),file:f,name:f.name,size:f.size,place,caption,status:'pending',err:''};Q.push(r);await qPut(r)}
  renderQ();
}
function renderQ(){
  const failed=Q.filter(r=>r.status==='failed').length,wait=Q.length-failed;
  $('qbox').classList.toggle('hide',!Q.length&&!SAVED);
  $('qsum').innerHTML=`Saved: ${SAVED} &nbsp;·&nbsp; <span class="${failed?'bad':''}">Failed: ${failed}</span> &nbsp;·&nbsp; Waiting: ${wait}`;
  $('qlist').innerHTML=Q.length?Q.map(r=>`<div class="row"><span><em class="${r.status==='failed'?'bad':''}">${r.status}</em>${esc(r.name)}<small>${r.place?'in '+esc(r.place)+' · ':''}${(r.size/1048576).toFixed(1)} MB${r.err?' · '+esc(r.err):''}</small></span></div>`).join(''):'<div class="empty">All saved. Nothing pending.</div>';
  $('qretry').disabled=running||!Q.length;$('qclear').disabled=running||!failed;
  const tot=SAVED+Q.length;$('bar').style.width=(tot?SAVED/tot*100:0)+'%';
}
async function clearFailed(){
  if(running)return;if(!confirm('Remove the failed photos from the queue? They will not be uploaded.'))return;
  for(const r of Q.filter(r=>r.status==='failed'))await qDel(r.id);
  Q=Q.filter(r=>r.status!=='failed');renderQ();
}
async function runQueue(){
  if(running)return;running=true;optN=0;renderQ();
  const todo=Q.filter(r=>r.status!=='done');let n=0;
  for(const r of todo){
    n++;say(`Uploading ${n} of ${todo.length}…  (saved so far: ${SAVED})`);r.status='uploading';renderQ();
    try{
      const p=await prepare(r.file);if(p.opt)optN++;
      await postRetry({action:'upload',uid:r.uid,place:r.place,caption:r.caption,data:p.data,mime:p.mime,name:p.name});
      await qDel(r.id);Q=Q.filter(x=>x!==r);setSaved(SAVED+1);
    }catch(e){r.status='failed';r.err=(e&&e.message)||'error';await qPut(r)}
    renderQ();
  }
  running=false;renderQ();await load();
  const failed=Q.filter(r=>r.status==='failed').length;
  say(failed?`Saved ${SAVED}, failed ${failed}. Failed photos are kept in this browser: press "Retry / Resume".`
            :`All done: ${SAVED} photo(s) saved.`+(optN?` (${optN} large photo(s) saved at 95% JPEG, full resolution)`:''));
}
addEventListener('beforeunload',e=>{if(running){e.preventDefault();e.returnValue=''}});

async function submitIt(){
  const caption=$('cap').value.trim(),place=$('fold').value;
  if(tab==='photo'){
    if(!picked.length&&!Q.length)return say('Select images first');
    if(running)return say('An upload is already running…');
    await enqueue(picked,place,caption);
    picked=[];$('pv').innerHTML='';$('droptxt').textContent='Click or drop images here';$('files').value='';$('cap').value='';
    return runQueue();
  }
  try{
    if(tab==='video'){
      const url=$('vurl').value.trim();if(!url)return say('Paste a video link');
      const r=await postRetry({action:'video',place,caption,url});$('vurl').value='';
    }else if(tab==='youtube'){
      const url=$('yurl').value.trim();if(!ytId(url))return say('Paste a valid YouTube link');
      const r=await postRetry({action:'youtube',place,caption,url});$('yurl').value='';
    }else{
      const text=$('ntext').value.trim();if(!text)return say('Write a note');
      const r=await postRetry({action:'note',place,caption,text});$('ntext').value='';
    }
    say('Added to the album.');$('cap').value='';lp();load();
  }catch(e){say('Error: '+e.message)}
}

/* manage list with previews */
const miniOf=(i,n)=>{
  if(i.type==='photo')return `<img loading="lazy" src="https://drive.google.com/thumbnail?id=${esc(i.fileId)}&sz=w200" alt="">`;
  if(i.type==='youtube')return `<img loading="lazy" src="https://img.youtube.com/vi/${ytId(i.value)}/mqdefault.jpg" alt="">`;
  if(i.type==='video')return `<video src="${esc(vurl(i.value))}#t=0.5" preload="metadata" muted playsinline></video>`;
  if(i.type==='folder')return '&#128193;';
  return '&#128221;';
};
async function load(){
  try{
    const d=await fetch(API).then(r=>r.json());
    ITEMS=d.items||[];
    fillFolders();
    $('list').innerHTML=ITEMS.length?ITEMS.map((i,n)=>{
      const label=i.type==='folder'?i.place:(i.caption||i.value||'').toString().slice(0,60);
      const where=i.type!=='folder'&&i.place?`<small>in ${esc(i.place)}</small>`:'';
      return `<div class="row"><div class="mini" onclick="showP(${n})" title="Preview">${miniOf(i,n)}</div><span><em>${esc(i.type)}</em>${esc(label)}${where}</span><button class="sm" onclick="showP(${n})">Preview</button><button class="sm" onclick="del('${esc(i.id)}')">Delete</button></div>`}).join(''):'<div class="empty">Nothing yet. Upload a photo, video, YouTube link or note above.</div>';
  }catch(e){$('list').innerHTML='<div class="empty">Could not load items.</div>'}
}
function showP(n){
  const i=ITEMS[n];if(!i)return;const c=$('pc');c.className='';
  $('pt').textContent=(i.type==='folder'?i.place:(i.caption||i.type))+(i.place&&i.type!=='folder'?'  ·  '+i.place:'');
  if(i.type==='photo')c.innerHTML=`<img src="https://drive.google.com/thumbnail?id=${esc(i.fileId)}&sz=w2000" alt="">`;
  else if(i.type==='youtube'){const id=ytId(i.value);c.innerHTML=id?`<iframe src="https://www.youtube-nocookie.com/embed/${id}" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`:'<div class="empty">Invalid YouTube link</div>'}
  else if(i.type==='video')c.innerHTML=`<video controls autoplay playsinline src="${esc(vurl(i.value))}"></video>`;
  else if(i.type==='note'){c.className='note';c.textContent=i.value}
  else{c.className='note';c.textContent='Folder: '+i.place}
  $('pov').classList.add('on');
}
function closeP(){$('pov').classList.remove('on');$('pc').innerHTML=''}
$('pov').addEventListener('click',e=>{if(e.target.id==='pov')closeP()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeP()});
async function del(id){if(!confirm('Delete this item?'))return;const r=await post({action:'delete',id});r.ok?load():alert(r.error)}
</script>
